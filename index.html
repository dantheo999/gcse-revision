<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2742c4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Revision">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>GCSE Revision Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one calm column, a sticky tab bar, and a single big "tonight" card. Highlighter marks are the only flourish. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --sunk:#e8edf6; --ink:#15203a; --muted:#56627d; --line:#d8dfeb;
  --brand:#2742c4; --brand-ink:#ffffff; --hl:#ffe24a; --hl-ink:#15203a;
  --good:#1d8a55; --warn:#b26a00;
  --sub-l:40%; --sub-s:62%; --tint-l:95%; --tint-s:70%;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1322; --surface:#161d31; --sunk:#1d2640; --ink:#e7ecf7; --muted:#9ba7c2; --line:#2a3452;
  --brand:#8ea3ff; --brand-ink:#0e1322; --hl:#d9bd2b; --hl-ink:#0e1322;
  --good:#5ccf93; --warn:#f0b04a;
  --sub-l:70%; --sub-s:65%; --tint-l:20%; --tint-s:35%; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1322; --surface:#161d31; --sunk:#1d2640; --ink:#e7ecf7; --muted:#9ba7c2; --line:#2a3452;
  --brand:#8ea3ff; --brand-ink:#0e1322; --hl:#d9bd2b; --hl-ink:#0e1322;
  --good:#5ccf93; --warn:#f0b04a;
  --sub-l:70%; --sub-s:65%; --tint-l:20%; --tint-s:35%; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hl{background:linear-gradient(100deg,transparent 0 2%,var(--hl) 2% 97%,transparent 97%) 0 62%/100% 58% no-repeat;color:inherit;padding:0 .12em}

/* header */
header.top{padding-top:20px;display:flex;flex-direction:column;gap:6px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brand{font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
.count{font-size:.95rem;color:var(--muted)}
.count b{color:var(--ink)}
.chip-status{font-size:.78rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip-status.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;margin-top:6px}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.tabbar.two{grid-template-columns:1fr 1fr}
.tabbar button{border:0;background:transparent;padding:9px 2px;border-radius:9px;font-weight:700;font-size:.86rem;color:var(--muted);min-width:0}
.tabbar button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}

main{display:flex;flex-direction:column;gap:22px;padding-top:8px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:1.25rem}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}

/* subject colour */
.s{--c:hsl(var(--h) var(--sub-s) var(--sub-l));--t:hsl(var(--h) var(--tint-s) var(--tint-l))}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block}

/* tonight card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.big{border-top:6px solid var(--c);background:linear-gradient(180deg,var(--t),var(--surface) 140px)}
.big .subj{font-size:clamp(1.8rem,7vw,2.6rem);font-weight:800;letter-spacing:-.02em}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.c{background:var(--t);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.topic{font-size:1.15rem;font-weight:700}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:grid;grid-template-columns:4.2em 1fr;gap:10px;align-items:baseline}
.steps .mins{font-family:var(--f-mono);font-size:.85rem;color:var(--c);font-weight:500}
.tip{font-size:.9rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;font-weight:700}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.done{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.small{padding:6px 11px;font-size:.88rem;border-radius:8px}
.btn.ghost{background:transparent}
.timer{font-family:var(--f-mono);font-size:2rem;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.timer-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sunk);border-radius:12px;padding:10px 14px}
.swaps{display:flex;gap:6px;flex-wrap:wrap}
.swaps button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.calm{font-size:1.05rem}

/* session rows */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.row.isdone{background:var(--sunk)}
.row.isdone .rt{text-decoration:line-through;text-decoration-color:var(--muted)}
.tick{width:30px;height:30px;border-radius:9px;border:2px solid var(--c);background:transparent;display:grid;place-items:center;padding:0;margin-top:1px}
.tick svg{width:18px;height:18px;opacity:0}
.tick[aria-pressed="true"]{background:var(--c)}
.tick[aria-pressed="true"] svg{opacity:1;stroke:var(--surface)}
.row details{min-width:0}
.row summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.row summary::-webkit-details-marker{display:none}
.rt{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rs{font-size:.92rem;color:var(--muted)}
.row .more{padding-top:10px;display:flex;flex-direction:column;gap:10px}

/* week */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav .wk{text-align:center;display:flex;flex-direction:column}
.weeknav .wk b{font-family:var(--f-display);font-size:1.1rem}
.day{display:grid;grid-template-columns:4.5em 1fr;gap:10px;align-items:start}
.day .dl{padding-top:12px;display:flex;flex-direction:column;line-height:1.2}
.day .dl b{font-family:var(--f-display);font-size:1.05rem}
.day.today .dl b{background:var(--hl);color:var(--hl-ink);border-radius:4px;padding:0 4px;align-self:flex-start}
.off{padding:12px;color:var(--muted);font-size:.92rem;border:1px dashed var(--line);border-radius:12px}
.rest-banner{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:var(--sunk);border-radius:12px;padding:12px 14px}

/* progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .n{font-family:var(--f-display);font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:.85rem;color:var(--muted)}
.ringwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring text{fill:var(--ink);font-family:var(--f-display);font-weight:800}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.92rem}
.bar-h b{display:inline-flex;gap:8px;align-items:center}
.track{position:relative;height:12px;background:var(--sunk);border-radius:999px;overflow:hidden;margin-top:5px}
.track .due{position:absolute;inset:0 auto 0 0;background:var(--t);border-right:2px solid var(--c)}
.track .got{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:999px}
.phasebar{display:flex;height:30px;border-radius:10px;overflow:hidden;position:relative;font-size:.75rem;font-weight:700}
.phasebar div{display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;color:var(--ink)}
.ph-M{background:color-mix(in srgb,var(--warn) 22%,var(--surface))}
.ph-X{background:color-mix(in srgb,var(--warn) 45%,var(--surface))}
.ph-R{background:color-mix(in srgb,var(--warn) 32%,var(--surface))}
.ph-L{background:color-mix(in srgb,var(--brand) 18%,var(--surface))}
.ph-P{background:color-mix(in srgb,var(--brand) 32%,var(--surface))}
.ph-E{background:color-mix(in srgb,var(--brand) 48%,var(--surface))}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.grades{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.9rem}
.grades label{display:inline-flex;gap:6px;align-items:center;font-weight:700}
.grades select{width:auto;padding:5px 8px}
.nowmark{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.phaselegend{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;font-size:.9rem}
.phaselegend b{display:block}

/* settings */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-weight:700;font-size:.92rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
select,input[type=date],input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:180px;font-size:.92rem;line-height:1.45}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips button{width:52px;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.daychips button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.subjcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.subjcard.offsub{opacity:.62}
.subj-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.subj-top .nm{font-weight:700;flex:1;min-width:140px;display:flex;align-items:center;gap:8px}
.switch{width:46px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-checked="true"]{background:var(--c)}
.switch[aria-checked="true"]::after{left:21px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--sunk);width:34px;height:32px;font-weight:700;font-size:1.1rem}
.stepper span{min-width:2.4em;text-align:center;font-family:var(--f-mono)}
.subj-why{font-size:.88rem;color:var(--muted)}
.subjcard details summary{cursor:pointer;font-size:.9rem;font-weight:700;color:var(--brand)}
.subjcard details[open] summary{margin-bottom:8px}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:.92rem}
.note p{margin:0 0 6px}.note p:last-child{margin:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
a{color:var(--brand)}
h3{font-size:1.1rem}
.pill.together{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}
.buddystrip{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;color:var(--muted)}
.buddystrip b{color:var(--ink)}
.buddystrip .ok,.bstat.ok{color:var(--good)}
.buddystrip .live,.bstat.live{color:var(--good);font-weight:700}
.bstat.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.buddy{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.bname{display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:800;font-family:var(--f-display)}
.bstat{font-size:.95rem}
.bnums{font-size:.82rem;color:var(--muted)}
.codecard{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
.code{font-size:2rem;letter-spacing:.18em;font-weight:500}
.corelist{display:flex;flex-direction:column;gap:8px}
.corerow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
.err{color:var(--warn);font-weight:700;margin:0}
.authwrap{max-width:440px;margin:0 auto;width:100%}
.authform{display:flex;flex-direction:column;gap:14px}
input[type=email],input[type=password]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button:disabled{opacity:.6;cursor:default}
@media (max-width:360px){.tabbar button{font-size:.78rem}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <h1 class="brand">GCSE <span class="hl">Revision</span> Plan</h1>
      <span id="status" class="chip-status">Saved on this device</span>
    </div>
    <div id="countdown" class="count"></div>
  </header>
  <nav class="tabs" aria-label="Sections">
    <div class="tabbar" role="tablist">
      <button role="tab" data-tab="tonight" aria-selected="true">Tonight</button>
      <button role="tab" data-tab="week" aria-selected="false">Week</button>
      <button role="tab" data-tab="buddies" aria-selected="false">Buddies</button>
      <button role="tab" data-tab="progress" aria-selected="false">Progress</button>
      <button role="tab" data-tab="setup" aria-selected="false">Set up</button>
    </div>
  </nav>
  <main id="main"></main>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>

      slots.push({key,date:ds,d:new Date(d),i,m:rec&&rec.m?rec.m:b.m,exam:!!b.exam,long:!!b.long,sid,topic,done:!!rec,swapped:!!(sw&&!rec),phase:ph,together:together?{k:together.k,n:together.n}:null});
    });

}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hrs=m=>{const h=m/60;return (Math.round(h*10)/10).toString().replace(/\.0$/,"")};
const hm=m=>m>=60?(Math.floor(m/60)+"h"+(m%60?" "+(m%60)+"m":"")):m+" min";
const TICK='<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function steps(sl,info){
  const m=sl.m,k=sl.phase.k;
  if(k==="X"){const e=Math.max(5,Math.round(m*.15/5)*5);
    return [[e,"Check tomorrow's mock. If it's a different subject, swap this session to it."],[m-2*e,"Quick recap only: key facts, formulas, quotes or vocab on flashcards. No new learning."],[e,"Pack your bag (pens, calculator, ruler) and get an early night."]]}
  if(sl.exam){const prep=5,mark=Math.max(10,Math.round(m*.25/5)*5);
    return [[prep,"Get the paper, mark scheme and a timer ready."],[m-prep-mark,EXAMACT[sl.phase.k]],[mark,"Mark it. Write down two things to fix next time."]]}
  const warm=Math.max(5,Math.round(m*.12/5)*5),check=Math.max(5,Math.round(m*.2/5)*5);
  const main=k==="R"?"If your "+info.name+" mock is back, go through it: redo every question you dropped marks on and add weak topics to your fix list. If it isn't back yet: "+ACT[info.kind].L:ACT[info.kind][k];
  if(sl.together)return [[warm,"Brain dump on your own: everything you already know about this. Then compare lists."],[m-warm-check,main+" Work side by side (or on a call) and help each other with anything stuck."],[check,"Quiz each other: take turns asking 5 questions each. Star anything either of you got wrong."]];
  return [[warm,"Brain dump: write down everything you already know about this. No notes."],[m-warm-check,main],[check,"Test yourself: cover it up and recall, or check answers. Star anything still shaky."]];
}

function viewProgress(plan){
  const t=ymd(todayD());
  const due=plan.filter(s=>s.date<=t),done=plan.filter(s=>s.done);
  const pct=due.length?Math.round(done.filter(s=>s.date<=t).length/due.length*100):0;
  const minsDone=done.reduce((a,s)=>a+s.m,0),minsAll=plan.reduce((a,s)=>a+s.m,0);
  // streak of study days fully done, counting back from today (today only counts if done)
  const byDay={};plan.forEach(s=>{(byDay[s.date]=byDay[s.date]||[]).push(s)});
  const daysList=Object.keys(byDay).filter(d=>d<=t).sort().reverse();
  let streak=0;for(const d of daysList){const all=byDay[d].every(s=>s.done);if(all)streak++;else if(d===t)continue;else break}
  const r=46,C=2*Math.PI*r;

   '<div style="flex:1;min-width:180px"><h2>Sessions done so far</h2><p class="muted" style="margin:.3em 0 0"><span class="mono">'+done.filter(s=>s.date<=t).length+'</span> of <span class="mono">'+due.length+'</span> sessions planned up to today. Anything above 80% is a strong term.</p></div></div></div>'+
   '<div class="stats"><div class="stat"><span class="n">'+hrs(minsDone)+'h</span><span class="l">revised so far</span></div><div class="stat"><span class="n">'+streak+'</span><span class="l">study days in a row</span></div><div class="stat"><span class="n">'+hrs(minsAll-minsDone)+'h</span><span class="l">left in the plan</span></div></div></section>';
  // phases
  const st=state.settings,s0=parse(st.start),e0=parse(st.exam),span=e0-s0||1;
  const f=Math.max(0,Math.min(1,(todayD()-s0)/span)),segs=segments();
  h+='<section><div class="sec-h"><h2>Where you are in the plan</h2></div><div class="phasebar">'+segs.map(p=>{const w=(p.to-p.from)/span*100;return '<div class="ph-'+p.k+'" style="width:'+w+'%" title="'+p.name+'">'+(w>=9?p.short:'')+'</div>'}).join("")+'<span class="nowmark" style="left:calc('+(f*100)+'% - 1px)" title="Today"></span></div>';
  h+='<div class="phaselegend">'+segs.map(p=>'<div><b><span class="sw ph-'+p.k+'"></span>'+p.name+'</b><span class="muted mono" style="font-size:.82rem">'+fmt(p.from)+' – '+fmt(addDays(p.to,-1))+'</span><br>'+p.desc+'</div>').join("")+'</div></section>';
  // subjects
  const subs=activeSubjects();
  const maxAll=Math.max(1,...subs.map(s=>plan.filter(x=>x.sid===s.id).reduce((a,x)=>a+x.m,0)));
  h+='<section><div class="sec-h"><h2>By subject</h2><span class="muted" style="font-size:.85rem">Solid = done · tint = planned by today</span></div><div class="card bars">';
  subs.forEach(s=>{
    const mine=plan.filter(x=>x.sid===s.id),all=mine.reduce((a,x)=>a+x.m,0),dueM=mine.filter(x=>x.date<=t).reduce((a,x)=>a+x.m,0),got=mine.filter(x=>x.done).reduce((a,x)=>a+x.m,0);
    const topicsDone=new Set(mine.filter(x=>x.done&&!x.exam).map(x=>x.topic)),nT=s.topics.length,cov=s.topics.filter(x=>topicsDone.has(x)).length;
    const behind=dueM-got;
    h+='<div '+subjStyle(s)+'><div class="bar-h"><b><span class="dot"></span>'+esc(s.name)+'</b><span class="muted mono">'+hrs(got)+' / '+hrs(all)+' h · '+cov+'/'+nT+' topics'+(behind>=90?' · <span style="color:var(--warn)">'+hrs(behind)+'h behind</span>':'')+'</span></div>'+
      '<div class="track" style="width:'+(all/maxAll*100)+'%">'+(dueM?'<span class="due" style="width:'+(dueM/all*100)+'%"></span>':'')+(got?'<span class="got" style="width:'+(got/all*100)+'%"></span>':'')+'</div></div>';
  });
  h+='</div></section>';
  return h;
}

function streakOf(plan){

  // together nights
  const next=Object.keys(sched).filter(d=>d>=t).sort().slice(0,5);
  h+='<section><div class="sec-h"><h2>Together nights</h2></div><p class="muted" style="margin:0">On these nights everyone\'s first session is the same subject. Each of you still gets the topic from your own list, so it matches when your lists match (same tier and board).</p>'+
    '<div class="card"><div class="field"><span class="lab">Nights</span><div class="daychips">'+DAYS.map((d,i)=>'<button data-act="gday" data-i="'+i+'" aria-pressed="'+!!gs.days[i]+'">'+d+'</button>').join("")+'</div></div>'+
    '<div class="field"><span class="lab">Subjects you line up on</span><div class="corelist">'+CORE.map(c=>{const v=gs.core[c.k]||{on:false,w:c.w};
      return '<div class="corerow"><span>'+esc(c.name)+'</span>'+(v.on?'<span class="stepper"><button data-act="gw" data-k="'+c.k+'" data-d="-0.5" aria-label="Fewer '+esc(c.name)+' nights">−</button><span>'+v.w+'</span><button data-act="gw" data-k="'+c.k+'" data-d="0.5" aria-label="More '+esc(c.name)+' nights">+</button></span>':'')+'<button class="switch" role="switch" aria-checked="'+!!v.on+'" data-act="gon" data-k="'+c.k+'" aria-label="Line up on '+esc(c.name)+'"></button></div>'}).join("")+'</div></div>'+
    '<p class="tip" style="margin:0">Changes here apply to everyone in the group. Together nights only count on nights you\'ve also set as study days, and they pause during your mock weeks.</p></div>';
  if(next.length)h+='<div class="rows">'+next.map(d=>{const g=sched[d],c=CORE.find(x=>x.k===g.k),mine=plan.find(s=>s.date===d&&s.i===0);
    const ok=mine&&mine.together;return '<div class="row"><span class="dot" style="margin-top:8px;background:var(--good)"></span><div><span class="rt">'+DAYS[dow(parse(d))]+' '+fmt(parse(d))+' · '+esc(c?c.name:g.k)+'</span><span class="rs">'+(ok?esc(mine.topic):'Not in your plan that night (night off, rest week, mocks or you don\'t take it)')+'</span></div></div>'}).join("")+'</div>';
  h+='</section><section><div class="card">'+(confirmLeave?'<div class="confirm"><b>Leave '+esc(group.name)+'?</b><button class="btn" style="border-color:var(--warn);color:var(--warn)" data-act="gleave-yes">Yes, leave</button><button class="btn ghost" data-act="gleave-no">Cancel</button></div>':'<div><button class="btn ghost" data-act="gleave">Leave group</button></div>')+'<p class="tip" style="margin:0">Your plan and progress stay yours. Group members only see your name, tonight\'s subjects, and your weekly and streak numbers.</p></div></section>';
  return h;
}
function viewAuth(){
  const up=authTab==="up";
  return '<section class="authwrap"><div class="card"><div class="tabbar two" role="tablist"><button role="tab" data-act="authtab" data-t="in" aria-selected="'+!up+'">Sign in</button><button role="tab" data-act="authtab" data-t="up" aria-selected="'+up+'">Create account</button></div>'+
    '<form id="authform" class="authform" novalidate>'+
    (up?'<div class="field"><label for="a-name">Your first name</label><input type="text" id="a-name" autocomplete="given-name" maxlength="40" required></div>':'')+
    '<div class="field"><label for="a-email">Email</label><input type="email" id="a-email" autocomplete="email" inputmode="email" required></div>'+
    '<div class="field"><label for="a-pass">Password</label><input type="password" id="a-pass" autocomplete="'+(up?'new-password':'current-password')+'" minlength="8" required>'+(up?'<span class="tip">At least 8 characters.</span>':'')+'</div>'+
    (authMsg?'<p class="err">'+esc(authMsg)+'</p>':'')+
    '<button class="btn primary" type="submit"'+(authBusy?' disabled':'')+'>'+(authBusy?'One moment…':up?'Create account':'Sign in')+'</button></form>'+
    '<button class="btn ghost small" data-act="offline">Use without an account on this device</button></div></section>';
}
async function submitAuth(){
  const email=(document.getElementById("a-email").value||"").trim(),pass=document.getElementById("a-pass").value||"";
  const nameEl=document.getElementById("a-name"),name=nameEl?(nameEl.value||"").trim():"";
  if(!email||!pass){authMsg="Enter your email and password.";return render()}
  if(authTab==="up"&&!name){authMsg="Enter your first name so your friends know it's you.";return render()}
  if(authTab==="up"&&pass.length<8){authMsg="Use a password of at least 8 characters.";return render()}
  authBusy=true;authMsg="";render();
  let res;
  if(authTab==="up")res=await sb.auth.signUp({email,password:pass,options:{data:{display_name:name}}});
  else res=await sb.auth.signInWithPassword({email,password:pass});
  authBusy=false;
  if(res.error){const m=res.error.message||"";
    authMsg=/already registered/i.test(m)?"There's already an account with that email. Sign in instead.":/invalid login/i.test(m)?"That email and password don't match. Check them and try again.":/signups? not allowed/i.test(m)?"New accounts are switched off. Ask whoever runs this app to let you in.":m||"That didn't work. Check your connection and try again.";
    return render()}
  if(authTab==="up"&&!res.data.session){authTab="in";authMsg="Account created. Check your email for a confirmation link, then sign in.";return render()}
  authMsg="";
}
async function groupCall(fn,args){
  gBusy=true;gErr="";render();
  const {data,error}=await sb.rpc(fn,args);
  gBusy=false;
  if(error){gErr=/no group/i.test(error.message)?"There's no group with that code. Check it and try again.":/full/i.test(error.message)?"That group is full.":"That didn't work. Check your connection and try again.";render();return null}
  return data;
}

function viewSetup(plan){
  const st=state.settings,wm=weeklyMinutes();
  const subs=Object.keys(state.subjects).filter(id=>!state.subjects[id].deleted).sort((a,b)=>(state.subjects[a].order||0)-(state.subjects[b].order||0)).map(subjInfo);
  const act=subs.filter(s=>s.on),W=act.reduce((a,s)=>a+s.w,0);
  const minsBy={};plan.forEach(s=>minsBy[s.sid]=(minsBy[s.sid]||0)+s.m);
  let h='';
  if(ONLINE&&user)h+='<section><div class="sec-h"><h2>Your account</h2></div><div class="card"><div class="field"><label for="f-dname">Your name (what study buddies see)</label><input type="text" id="f-dname" maxlength="40" value="'+esc(profile?profile.display_name:"")+'"></div><div class="acct"><span class="muted">Signed in as '+esc(user.email||"")+'</span><button class="btn small" data-act="signout">Sign out</button></div></div></section>';
  else if(ONLINE)h+='<section><div class="card"><h2>Not signed in</h2><p class="muted" style="margin:0">Your plan is only saved on this device. Sign in to sync it across your phone and tablet and to study with friends.</p><div><button class="btn primary" data-act="to-auth">Sign in or create an account</button></div></div></section>';
  h+='<section><div class="sec-h"><h2>Week shape</h2><span class="muted">'+hm(wm)+' a week</span></div><div class="card">'+
   '<div class="field"><span class="lab">Study days</span><div class="daychips">'+DAYS.map((d,i)=>'<button data-act="day" data-i="'+i+'" aria-pressed="'+!!st.days[i]+'">'+d+'</button>').join("")+'</div></div>'+
   '<div class="grid2">'+
    '<div class="field"><label for="f-long">Long session day</label><select id="f-long"><option value="-1">No long session</option>'+DAYS_LONG.map((d,i)=>st.days[i]?'<option value="'+i+'"'+(st.longDay===i?' selected':'')+'>'+d+'</option>':'').join("")+'</select></div>'+
    '<div class="field"><label for="f-longm">Long session length</label><select id="f-longm">'+[60,90,120,150,180].map(m=>'<option value="'+m+'"'+(st.longMin===m?' selected':'')+'>'+hm(m)+'</option>').join("")+'</select></div>'+
    '<div class="field"><label for="f-sess">Other nights: session length</label><select id="f-sess">'+[25,30,40,45,50,60].map(m=>'<option value="'+m+'"'+(st.sessionMin===m?' selected':'')+'>'+m+' min</option>').join("")+'</select></div>'+
    '<div class="field"><label for="f-per">Sessions per night</label><select id="f-per">'+[1,2].map(m=>'<option value="'+m+'"'+(+st.perNight===m?' selected':'')+'>'+m+(m===2?' (different subjects)':'')+'</option>').join("")+'</select></div>'+
    '<div class="field"><label for="f-start">Plan starts</label><input type="date" id="f-start" value="'+st.start+'"></div>'+
    '<div class="field"><label for="f-exam">First GCSE exam</label><input type="date" id="f-exam" value="'+st.exam+'"></div>'+
    '<div class="field"><label for="f-mstart">Mocks start</label><input type="date" id="f-mstart" value="'+(st.mockStart||'')+'"></div>'+
    '<div class="field"><label for="f-mend">Mocks end</label><input type="date" id="f-mend" value="'+(st.mockEnd||'')+'"></div>'+
   '</div><p class="tip" style="margin:0">During the mocks, sessions drop to 30 minutes (60 on the long day) for recapping the next day\'s subject. Clear the mock dates if you have no mocks. The GCSE date is an estimate: summer GCSEs usually start in the second week of May. Swap in the real date once your school publishes the timetable. The French speaking exam and the Art 10-hour exam usually happen a few weeks earlier.</p></div></section>';
  h+='<section><div class="sec-h"><h2>Subjects</h2><span class="muted">'+act.length+' on</span></div>'+
   '<div class="note"><p><b>How the weighting works.</b> Each subject gets a share of sessions in proportion to its weight. The defaults follow how much exam there is and how much needs memorising: Combined Science is a double GCSE with 6 papers, Foundation Maths has 3 and a grade 4 matters, English Literature is closed-book with quotes for several texts, French has four skills and a long vocab list, and Art is mostly coursework done in class.</p><p>After the mocks, enter your mock and target grade for each subject. From then on, subjects with the biggest gap get more time automatically. You can also raise the weight of anything you find hard. Topics are based on the AQA specs (the most common board); edit them to match your texts and options.</p></div>';
  subs.forEach(s=>{
    const share=s.on&&W?Math.round(s.w/W*100):0;
    h+='<div class="subjcard s'+(s.on?'':' offsub')+'" style="--h:'+s.h+'"><div class="subj-top"><span class="nm"><span class="dot"></span>'+esc(s.name)+'</span>'+
     (s.on?'<span class="stepper"><button data-act="w" data-id="'+s.id+'" data-d="-0.5" aria-label="Lower weight">−</button><span>'+s.w+'</span><button data-act="w" data-id="'+s.id+'" data-d="0.5" aria-label="Raise weight">+</button></span>':'')+
     '<button class="switch" role="switch" aria-checked="'+s.on+'" data-act="on" data-id="'+s.id+'" aria-label="Include '+esc(s.name)+'"></button></div>'+
     (s.on?'<div class="subj-why"><span class="mono">'+share+'%</span> of sessions · about <span class="mono">'+hrs(minsBy[s.id]||0)+'h</span> before exams. '+esc(s.why)+'</div>':'<div class="subj-why">'+esc(s.why)+'</div>')+
     (s.on?'<div class="grades">'+[["mock","Mock grade"],["target","Target"]].map(([f,l])=>'<label for="g-'+f+'-'+s.id+'">'+l+' <select id="g-'+f+'-'+s.id+'" data-grade="'+s.id+'" data-field="'+f+'"><option value="">–</option>'+[9,8,7,6,5,4,3,2,1].map(g=>'<option value="'+g+'"'+(s[f]===g?' selected':'')+'>'+g+'</option>').join("")+'</select></label>').join("")+
       (s.mock&&s.target?'<span class="muted">'+(gradeMult(s)>1?'Gets ×'+gradeMult(s).toFixed(1)+' more time after mocks':gradeMult(s)<1?'On track: ×'+gradeMult(s).toFixed(1)+' time after mocks':'On target')+'</span>':'')+'</div>':'')+
     '<details><summary>Edit name & topics ('+s.topics.length+')</summary><div class="field"><label for="n-'+s.id+'">Name</label><input type="text" id="n-'+s.id+'" data-name="'+s.id+'" value="'+esc(s.name)+'"></div><div class="field" style="margin-top:8px"><label for="tp-'+s.id+'">Topics, one per line (sessions cycle through them in order)</label><textarea id="tp-'+s.id+'" data-topics="'+s.id+'">'+esc(s.topics.join("\n"))+'</textarea></div>'+
     (preset(s.id)?'':'<button class="btn small ghost" data-act="del" data-id="'+s.id+'" style="margin-top:8px;align-self:flex-start">Remove subject</button>')+'</details></div>';
  });
  h+='<div class="subjcard"><div class="field"><label for="f-new">Add another subject</label><div style="display:flex;gap:8px"><input type="text" id="f-new" placeholder="e.g. Spanish, Music, Business"><button class="btn primary" data-act="add">Add</button></div></div></div></section>';
  h+='<section><div class="sec-h"><h2>Start over</h2></div><div class="card"><p style="margin:0" class="muted">Clears every tick and swap. Settings and subjects stay.</p>'+
   (confirmReset?'<div class="confirm"><b>Clear all progress?</b><button class="btn" style="border-color:var(--warn);color:var(--warn)" data-act="reset-yes">Yes, clear it</button><button class="btn ghost" data-act="reset-no">Cancel</button></div>':'<div><button class="btn" data-act="reset">Clear progress…</button></div>')+'</div></section>';
  return h;
}

function render(){
  const main=document.getElementById("main"),nav=document.querySelector("nav.tabs");
  if(ONLINE&&authMode==="pending"){nav.hidden=true;main.innerHTML='<section><p class="muted">Loading your plan…</p></section>';return}
  if(ONLINE&&authMode==="out"&&!offlineChosen){nav.hidden=true;document.getElementById("countdown").textContent="Sign in to sync your plan across devices and study with friends.";main.innerHTML=viewAuth();return}
  nav.hidden=false;
  const plan=buildPlan();
  header(plan);
  document.querySelectorAll(".tabbar button[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
  const v={tonight:viewTonight,week:viewWeek,buddies:viewBuddies,progress:viewProgress,setup:viewSetup}[tab];
  main.innerHTML=v(plan);
  publishSummary(plan);
}
setInterval(()=>{if(members.some(m=>m.studying))safeRender()},30000);

/* ---------- events ---------- */
document.querySelector(".tabbar").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;tab=b.dataset.tab;openSwap=null;confirmReset=false;try{history.replaceState(null,"","#"+tab)}catch(_){location.hash=tab}render();window.scrollTo(0,0)});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VALID.includes(h)&&h!==tab){tab=h;render()}});

document.getElementById("main").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,key=b.dataset.key;
  if(a==="done"){e.preventDefault();
    const plan=buildPlan(),sl=plan.find(s=>s.key===key);if(!sl)return;
    if(state.done[key])commit({done:{[key]:null}});
    else{commit({done:{[key]:{s:sl.sid,t:sl.topic,m:sl.m,at:ymd(todayD()),g:sl.together||null}}});if(timer.key===key)stopTimer()}
    openSwap=null;render();
  }
  else if(a==="swapopen"){openSwap=openSwap===key?null:key;render()}
  else if(a==="swap"){openSwap=null;commit({swaps:{[key]:b.dataset.sid||null}})}
  else if(a==="wk"){const d=+b.dataset.d;weekOffset=d===0?0:weekOffset+d;render()}
  else if(a==="rest"){const wk=b.dataset.wk;commit({restWeeks:{[wk]:!state.restWeeks[wk]}})}
  else if(a==="day"){const i=+b.dataset.i,days=state.settings.days.slice();days[i]=days[i]?0:1;const p={settings:{days}};if(!days[i]&&state.settings.longDay===i)p.settings.longDay=-1;commit(p)}
  else if(a==="w"){const id=b.dataset.id,s=state.subjects[id];const w=Math.max(.5,Math.min(10,(+s.w||1)+(+b.dataset.d)));commit({subjects:{[id]:{w}}})}
  else if(a==="on"){const id=b.dataset.id;commit({subjects:{[id]:{on:!state.subjects[id].on}}})}
  else if(a==="add"){const inp=document.getElementById("f-new");const name=(inp.value||"").trim();if(!name){inp.focus();return}
    const id="c"+Date.now().toString(36);const order=Object.keys(state.subjects).length+1;
    commit({subjects:{[id]:{name,on:true,w:3,order,topics:["Topic 1 (edit me)","Topic 2","Topic 3","Past paper questions"]}}})}
  else if(a==="del"){commit({subjects:{[b.dataset.id]:{deleted:true,on:false}}})}
  else if(a==="reset"){confirmReset=true;render()}
  else if(a==="reset-no"){confirmReset=false;render()}
  else if(a==="reset-yes"){confirmReset=false;const done={},swaps={};Object.keys(state.done).forEach(k=>done[k]=null);Object.keys(state.swaps).forEach(k=>swaps[k]=null);commit({done,swaps})}
  else if(a==="timer"){toggleTimer(key,+b.dataset.m)}
  else if(a==="timer-reset"){stopTimer();render()}
  else if(a==="to-auth"){offlineChosen=false;authMsg="";render()}
  else if(a==="offline"){offlineChosen=true;setStatus("local");render()}
  else if(a==="authtab"){authTab=b.dataset.t;authMsg="";render()}
  else if(a==="signout"){sb.auth.signOut()}
  else if(a==="gcreate"){const name=(document.getElementById("g-name").value||"").trim()||"Study group";
    const gs=defaultGroupSettings();gs.start=ymd(mondayOf(todayD()));
    groupCall("create_group",{p_name:name,p_settings:gs}).then(async d=>{if(!d)return;profile.group_id=d.id;await loadGroup();subscribe();render()})}
  else if(a==="gjoin"){const code=(document.getElementById("g-code").value||"").trim().toUpperCase();if(code.length<6){gErr="Invite codes are 6 characters.";return render()}
    groupCall("join_group",{p_code:code}).then(async d=>{if(!d)return;profile.group_id=d.id;await loadGroup();subscribe();render()})}
  else if(a==="gleave"){confirmLeave=true;render()}
  else if(a==="gleave-no"){confirmLeave=false;render()}
  else if(a==="gleave-yes"){confirmLeave=false;groupCall("leave_group",{}).then(()=>{if(gErr)return;profile.group_id=null;group=null;members=[];lastSummary="";subscribe();render()})}
  else if(a==="gcopy"){const code=group.code;const done=()=>{b.textContent="Copied";setTimeout(()=>{b.textContent="Copy code"},1500)};
    try{navigator.clipboard.writeText(code).then(done,()=>{b.textContent=code})}catch(_){b.textContent=code}}
  else if(a==="gday"||a==="gon"||a==="gw"){
    const gs=groupSettings();
    if(a==="gday"){const i=+b.dataset.i;gs.days[i]=gs.days[i]?0:1}
    else if(a==="gon"){const k=b.dataset.k;gs.core[k].on=!gs.core[k].on}
    else{const k=b.dataset.k;gs.core[k].w=Math.max(.5,Math.min(10,(+gs.core[k].w||1)+(+b.dataset.d)))}
    group.settings=gs;render();
    sb.from("groups").update({settings:gs}).eq("id",group.id).then(({error})=>{if(error){gErr="Couldn't save the group change. Check your connection.";render()}});
  }
});
document.getElementById("main").addEventListener("submit",e=>{if(e.target.id==="authform"){e.preventDefault();submitAuth()}});
document.getElementById("main").addEventListener("change",e=>{
  const t=e.target,st=state.settings;
  if(t.id==="f-long")commit({settings:{longDay:+t.value}});
  else if(t.id==="f-longm")commit({settings:{longMin:+t.value}});
  else if(t.id==="f-sess")commit({settings:{sessionMin:+t.value}});
  else if(t.id==="f-per")commit({settings:{perNight:+t.value}});
  else if(t.id==="f-start"&&t.value&&t.value<st.exam)commit({settings:{start:t.value}});
  else if(t.id==="f-exam"&&t.value&&t.value>st.start)commit({settings:{exam:t.value}});
  else if(t.id==="f-mstart")commit({settings:{mockStart:t.value||""}});
  else if(t.id==="f-mend")commit({settings:{mockEnd:t.value||""}});
  else if(t.dataset.grade){commit({subjects:{[t.dataset.grade]:{[t.dataset.field]:t.value?+t.value:null}}})}
  else if(t.dataset.topics){const id=t.dataset.topics;const topics=t.value.split("\n").map(x=>x.trim()).filter(Boolean);commit({subjects:{[id]:{topics}}})}
  else if(t.dataset.name){const id=t.dataset.name;const name=t.value.trim();if(name)commit({subjects:{[id]:{name}}})}
  else if(t.id==="f-dname"){const name=t.value.trim().slice(0,40);if(name)updateProfile({display_name:name}).then(render)}
});
document.getElementById("main").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="f-new"){e.preventDefault();document.querySelector('[data-act="add"]').click()}});

/* ---------- timer ---------- */
let tick=null,wake=null;
function toggleTimer(key,m){
  if(timer.key!==key){stopTimer();timer={key,left:m*60,endAt:0,running:false}}
  if(timer.running){timer.left=(timer.endAt-Date.now())/1000;timer.running=false;clearInterval(tick);releaseWake()}
  else{timer.endAt=Date.now()+timer.left*1000;timer.running=true;clearInterval(tick);tick=setInterval(step,500);
    try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{})}catch(_){}}
  presence();
  render();
}
/* tell study buddies when a timer is running */
let presenceOn=false;
function presence(){
  if(!user||!group)return;
  if(timer.running&&timer.key){const sl=buildPlan().find(s=>s.key===timer.key);
    presenceOn=true;updateProfile({studying:{until:new Date(timer.endAt).toISOString(),subject:sl?subjInfo(sl.sid).name:"Revision"}})}
  else if(presenceOn){presenceOn=false;updateProfile({studying:null})}
}
function step(){
  if(!timer.running)return;
  timer.left=(timer.endAt-Date.now())/1000;
  const el=document.getElementById("t-"+timer.key);
  if(timer.left<=0){timer.left=0;timer.running=false;clearInterval(tick);releaseWake();if(el)el.textContent="Time's up";const b=document.querySelector('[data-act="timer"][data-key="'+timer.key+'"]');if(b)b.textContent="Restart";timer.key=null;presence();return}
  if(el)el.textContent=clock(timer.left);
}
function stopTimer(){clearInterval(tick);timer={key:null,left:0,endAt:0,running:false};releaseWake();presence()}
function releaseWake(){try{wake&&wake.release()}catch(_){}wake=null}

render();
initServer();
})();
